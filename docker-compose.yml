services:
  # Base de datos PostgreSQL
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user_admin
      POSTGRES_PASSWORD: 'password123'
      POSTGRES_DB: simulation_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_admin -d simulation_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Visor web de la base de datos
  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      - db

  # API Node.js + Prisma
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "postgresql://user_admin:password123@db:5432/simulation_db"
      ADMIN_EMAIL: "admin@admin.es"
      ADMIN_PASSWORD: "password123"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  # App React
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app/frontend
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"